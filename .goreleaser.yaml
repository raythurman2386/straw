scoops:
  - repository:
      owner: raythurman2386
      name: scoop-bucket
    homepage: "https://github.com/raythurman2386/straw"
    description: "File automation system with TUI client and daemon"
    license: MIT

nfpms:
  - id: packages
    package_name: straw
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Ray Thurman
    homepage: "https://github.com/raythurman2386/straw"
    maintainer: "Ray Thurman <rthurman2386@gmail.com>"
    description: "File automation system with TUI client and daemon"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    contents:
      - src: ./config.example.toml
        dst: /etc/straw/config.example.toml
        type: config|noreplace

