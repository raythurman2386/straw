site_name: Straw Documentation
site_description: Modern file automation system documentation
site_author: Ray Thurman
site_url: https://raythurman2386.github.io/straw
# Repository
repo_url: https://github.com/raythurman2386/straw
edit_uri: https://github.com/raythurman2386/straw/edit/main/docs/

# Copyright
copyright: Copyright &copy; 2026 Ray Thurman

# Theme
theme:
  name: material
  palette:
    # Ravenwood Dark Mode (default) - using slate as base
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light Mode (alternative)
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
    - Configuration: configuration.md
  - Usage:
    - Daemon: usage/daemon.md
    - TUI Client: usage/tui.md
    - Rules: usage/rules.md
    - Actions: usage/actions.md
  - Reference:
    - Match Criteria: reference/match-criteria.md
    - Actions Reference: reference/actions-reference.md
    - Configuration Examples: reference/examples.md
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - API Reference: development/api.md
  - FAQ: faq.md
  - Changelog: changelog.md

# Extra social links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/raythurman2386
      name: GitHub
  version:
    provider: mike
